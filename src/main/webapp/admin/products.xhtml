<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Zarządzanie produktami - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #f0f0f0; padding: 10px; margin-bottom: 20px; }
        .add-form { background: #e8f4f8; padding: 15px; margin-bottom: 20px; }
        .product-table { width: 100%; border-collapse: collapse; }
        .product-table th, .product-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .product-table th { background: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: inline-block; width: 100px; }
        .btn { padding: 5px 10px; margin: 2px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-danger { background: #dc3545; color: white; border: none; }
    </style>
</h:head>
<h:body>
    <div class="header">
        <h1>Panel Administratora - Zarządzanie Produktami</h1>
    </div>

    <!-- Formularz dodawania produktu -->
    <div class="add-form">
        <h3>Dodaj nowy produkt</h3>
        <h:form>
            <div class="form-group">
                <h:outputLabel value="Nazwa: " for="productName" />
                <h:inputText id="productName" value="#{adminController.newProduct.name}"
                             required="true" requiredMessage="Nazwa jest wymagana" />
            </div>

            <div class="form-group">
                <h:outputLabel value="Cena: " for="productPrice" />
                <h:inputText id="productPrice" value="#{adminController.newProduct.price}"
                             required="true" requiredMessage="Cena jest wymagana">
                    <f:convertNumber pattern="#0.00" />
                </h:inputText>
            </div>

            <h:commandButton value="Dodaj produkt"
                             action="#{adminController.addProduct}"
                             styleClass="btn btn-primary" />
        </h:form>
    </div>

    <!-- Lista produktów -->
    <div>
        <h3>Aktualne produkty</h3>
        <h:form>
            <h:dataTable value="#{productController.products}" var="product"
                         styleClass="product-table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{product.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nazwa</f:facet>
                    #{product.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Cena</f:facet>
                    <h:outputText value="#{product.price}">
                        <f:convertNumber pattern="#0.00 zł" />
                    </h:outputText>
                </h:column>
                <h:column>
                    <f:facet name="header">Akcje</f:facet>
                    <h:commandButton value="Usuń"
                                     action="#{adminController.deleteProduct(product.id)}"
                                     styleClass="btn btn-danger"
                                     onclick="return confirm('Czy na pewno chcesz usunąć ten produkt?');" />
                </h:column>
            </h:dataTable>
        </h:form>
    </div>

    <!-- Linki nawigacyjne -->
    <div style="margin-top: 20px;">
        <h:link value="Powrót do logowania" outcome="/login" />
    </div>

</h:body>
</html>
