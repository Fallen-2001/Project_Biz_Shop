<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://java.sun.com/jsf/core">
<h:head>
    <title>Товары</title>
</h:head>
<h:body>
    <h:dataTable value="#{productController.products}" var="product">
        <h:column>
            <f:facet name="header">Название</f:facet>
            #{product.name}
        </h:column>
        <h:column>
            <f:facet name="header">Цена</f:facet>
            #{product.price}
        </h:column>
    </h:dataTable>
</h:body>
</html>
