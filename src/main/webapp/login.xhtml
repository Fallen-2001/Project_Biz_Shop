<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Вход</title>
</h:head>
<h:body>
    <h:form>
        <h:outputLabel value="login:" />
        <h:inputText value="#{authController.username}" />

        <h:outputLabel value="password:" />
        <h:inputSecret value="#{authController.password}" />

        <h:commandButton value="accept" action="#{authController.login()}" />
    </h:form>
</h:body>
</html>
